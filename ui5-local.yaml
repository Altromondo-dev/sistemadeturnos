specVersion: "3.1"
metadata:
  name: transener.sistemadeturnos
type: application
framework:
  name: SAPUI5
  version: 1.79.0
  libraries:
    - name: sap.ui.layout
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: sap.ushell
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: http://sapdes.transx.net:8632
            client: "200"
            destination: SAP_Gateway
          - path: /destinations/Examinadores_PT15
            destination: Examinadores_PT15
            url: ""
            pathPrefix: /
          - path: /destinations/SAP_Gateway
            destination: SAP_Gateway
            url: http://sapdes.transx.net:8632
            client: "200"
            pathPrefix: /
              # Se comento para el Deploy a CF - Guillermo Quattrocchi
          # - path: /destinations/transenerStyling
          #   destination: TransenerStyling
          #   url: ""
          #   pathPrefix: /
          # - path: /destinations/styling
          #   destination: Styling
          #   url: ""
          #   pathPrefix: /
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: transener.sistemadeturnos
        ui5Theme: sap_fiori_3
